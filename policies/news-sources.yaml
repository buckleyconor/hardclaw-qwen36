preset:
  name: news-sources
  description: >-
    Curated news domains the agent is allowed to open with web_fetch.
    web_search (SearXNG) already returns snippets for the whole web; this only
    governs which full articles the agent can fetch. Kept to a small trusted
    set to preserve the deny-all posture. Apex + www variants are listed
    because these sites redirect between them.

network_policies:
  news_sources:
    name: news_sources
    endpoints:
      # --- Irish / general (interactive "latest news" questions) ---
      - host: rte.ie
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.rte.ie
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: irishtimes.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.irishtimes.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: thejournal.ie
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.thejournal.ie
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: bbc.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.bbc.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: bbc.co.uk
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.bbc.co.uk
