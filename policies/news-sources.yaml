        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      # --- AI news (12:00 daily briefing cron) ---
      - host: techcrunch.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.techcrunch.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: theregister.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
